<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Virtual Ant Farm — stigmergic foraging simulation" />
  <title>Virtual Ant Farm</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- ── 3-D plastic ant-farm frame ─────────────────────── -->
    <div id="farm-frame">

      <!-- Top bar: decorative silhouette + carrying handle -->
      <div id="farm-top-bar">
        <!-- Handle nubs -->
        <div class="handle-nub left"></div>
        <div class="handle-nub right"></div>

        <!-- Farm scene silhouette -->
        <svg id="farm-silhouette"
             viewBox="0 0 800 68"
             preserveAspectRatio="xMidYMax meet"
             xmlns="http://www.w3.org/2000/svg"
             aria-hidden="true">

          <!-- Rolling hills (dark soil silhouette at bottom of top bar) -->
          <path d="M0,68 L0,54 Q65,30 145,50 Q225,62 295,40
                   Q372,18 452,42 Q532,58 612,34 Q692,12 800,38 L800,68 Z"
                fill="#0d5010"/>

          <!-- House (left) -->
          <rect x="65"  y="24" width="92" height="46" fill="#0d5010"/>
          <polygon points="48,24 111,0 174,24"           fill="#0d5010"/>
          <rect x="122" y="0"  width="16" height="26"    fill="#0d5010"/>

          <!-- Tree cluster (left-centre) -->
          <polygon points="194,68 213,22 232,68" fill="#0d5010"/>
          <rect x="206" y="52" width="13" height="18"    fill="#0d5010"/>
          <polygon points="238,68 253,36 268,68" fill="#0d5010"/>
          <rect x="247" y="54" width="12" height="16"    fill="#0d5010"/>

          <!-- Barn (centre-left) -->
          <rect x="298" y="20" width="106" height="50"   fill="#0d5010"/>
          <polygon points="282,20 351,0 420,20"          fill="#0d5010"/>

          <!-- Windmill (centre-right) -->
          <polygon points="448,68 440,8 462,8 454,68"    fill="#0d5010"/>
          <circle  cx="451" cy="8" r="6"                 fill="#0d5010"/>
          <ellipse cx="451" cy="8" rx="31" ry="6"
                   transform="rotate(22,451,8)"           fill="#0d5010"/>
          <ellipse cx="451" cy="8" rx="31" ry="6"
                   transform="rotate(67,451,8)"           fill="#0d5010"/>
          <ellipse cx="451" cy="8" rx="31" ry="6"
                   transform="rotate(112,451,8)"          fill="#0d5010"/>
          <ellipse cx="451" cy="8" rx="31" ry="6"
                   transform="rotate(157,451,8)"          fill="#0d5010"/>

          <!-- Tree cluster (right-centre) -->
          <polygon points="532,68 550,26 568,68" fill="#0d5010"/>
          <rect x="543" y="52" width="13" height="18"    fill="#0d5010"/>
          <polygon points="572,68 588,38 604,68" fill="#0d5010"/>
          <rect x="581" y="54" width="12" height="16"    fill="#0d5010"/>

          <!-- Small house (right) -->
          <rect x="650" y="34" width="74" height="36"    fill="#0d5010"/>
          <polygon points="634,34 687,8 762,34"          fill="#0d5010"/>

          <!-- Fence posts (far right) -->
          <rect x="776" y="44" width="6" height="26"     fill="#0d5010"/>
          <rect x="790" y="44" width="6" height="26"     fill="#0d5010"/>
          <rect x="776" y="48" width="20" height="4"     fill="#0d5010"/>

        </svg>
      </div><!-- /farm-top-bar -->

      <!-- Side connector bolts (left) -->
      <div class="side-bolts left">
        <div class="bolt-peg"><span class="bolt-cap"></span></div>
        <div class="bolt-peg"><span class="bolt-cap"></span></div>
        <div class="bolt-peg"><span class="bolt-cap"></span></div>
      </div>

      <!-- The glass viewing area -->
      <div id="farm-glass">
        <canvas id="simulation-canvas"></canvas>
      </div>

      <!-- Side connector bolts (right) -->
      <div class="side-bolts right">
        <div class="bolt-peg"><span class="bolt-cap"></span></div>
        <div class="bolt-peg"><span class="bolt-cap"></span></div>
        <div class="bolt-peg"><span class="bolt-cap"></span></div>
      </div>

      <!-- Bottom bar: "ANT FARM" label -->
      <div id="farm-bottom-bar">
        <span class="farm-label">ANT FARM</span>
        <div class="bottom-bolts">
          <span class="bottom-bolt"></span>
          <span class="bottom-bolt"></span>
          <span class="bottom-bolt"></span>
        </div>
      </div>

    </div><!-- /farm-frame -->

    <!-- Desktop: right-side control panel -->
    <aside id="control-panel" aria-label="Simulation controls">
      <div class="panel-header">
        <h1>Ant Farm</h1>
        <button id="panel-toggle" class="icon-btn" aria-label="Collapse panel">&#8250;</button>
      </div>

      <div class="panel-body">
        <!-- Stats -->
        <section class="control-section" id="stats-section">
          <div class="stat-row">
            <span class="stat-label">Ants</span>
            <span class="stat-value" id="stat-ants">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Food collected</span>
            <span class="stat-value" id="stat-food">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Active sources</span>
            <span class="stat-value" id="stat-sources">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">FPS</span>
            <span class="stat-value" id="stat-fps">0</span>
          </div>
        </section>

        <!-- Simulation -->
        <section class="control-section">
          <h2>Simulation</h2>

          <label class="control-label" for="ant-count">
            Ant Count <span class="control-value" id="ant-count-val">100</span>
          </label>
          <input type="range" id="ant-count" min="1" max="500" value="100" step="1" />

          <label class="control-label" for="sim-speed">
            Speed <span class="control-value" id="sim-speed-val">1×</span>
          </label>
          <input type="range" id="sim-speed" min="0.25" max="5" value="1" step="0.25" />
        </section>

        <!-- Pheromones -->
        <section class="control-section">
          <h2>Pheromones</h2>

          <label class="control-label" for="phero-strength">
            Strength <span class="control-value" id="phero-strength-val">1.0</span>
          </label>
          <input type="range" id="phero-strength" min="0.1" max="3" value="1" step="0.1" />

          <label class="control-label" for="phero-decay">
            Decay Rate <span class="control-value" id="phero-decay-val">0.005</span>
          </label>
          <input type="range" id="phero-decay" min="0.001" max="0.05" value="0.005" step="0.001" />

          <div class="toggle-row">
            <label for="show-pheromones">Show Pheromones</label>
            <input type="checkbox" id="show-pheromones" checked role="switch" />
          </div>
        </section>

        <!-- Food -->
        <section class="control-section">
          <h2>Food</h2>

          <label class="control-label" for="food-rate">
            Spawn Rate <span class="control-value" id="food-rate-val">Med</span>
          </label>
          <input type="range" id="food-rate" min="1" max="5" value="3" step="1" />

          <div class="toggle-row">
            <label for="add-food-mode">Add Food Mode</label>
            <input type="checkbox" id="add-food-mode" role="switch" />
          </div>
          <p class="hint" id="food-hint" hidden>Click/tap the canvas to place food</p>
        </section>

        <!-- Display -->
        <section class="control-section">
          <h2>Display</h2>
          <div class="toggle-row">
            <label for="show-ant-count">Show Ant Count</label>
            <input type="checkbox" id="show-ant-count" checked role="switch" />
          </div>
        </section>

        <!-- Actions -->
        <section class="control-section actions-section">
          <button id="btn-pause" class="action-btn primary">Pause</button>
          <button id="btn-reset" class="action-btn secondary">Reset</button>
        </section>

        <p class="keyboard-hint">Spacebar = Pause/Resume</p>
      </div>
    </aside>

    <!-- Mobile: bottom sheet toggle tab -->
    <button id="mobile-sheet-tab" aria-label="Open controls">Controls &#8679;</button>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
